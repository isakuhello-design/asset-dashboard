<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b0a">
  <title>Ledger Mobile</title>
  <link rel="stylesheet" href="mobile.css">
  <style>
    .balance small{display:block;color:var(--muted);font-size:10px;margin-top:9px}.settings input:not([type="checkbox"]){width:100%;background:#090d0b;border:1px solid var(--line);color:var(--ink);padding:11px;margin:4px 0 10px}.switch,.interval{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:12px;margin:11px 0}.switch input{accent-color:var(--green)}.interval select{margin-left:auto;background:#090d0b;border:1px solid var(--line);color:var(--ink);padding:7px}
  </style>
</head>
<body>
  <main>
    <header><div class="brand"><b>L</b> LEDGER</div><button id="refresh" type="button">↻ 更新</button></header>
    <section class="balance"><p>総資産</p><strong id="total">¥0</strong><span id="total-profit">¥0</span><small id="last-update">価格未更新</small></section>
    <section class="metrics"><div><span>評価損益</span><b id="profit">¥0</b></div><div><span>保有銘柄</span><b id="count">0銘柄</b></div><div><span>取得額</span><b id="cost">¥0</b></div></section>
    <section><div class="section-title"><div><p>ALLOCATION</p><h1>ポートフォリオ</h1></div><span class="legend">緑：上昇　赤：下落</span></div><div id="heatmap" class="heatmap"></div></section>
    <section><div class="section-title"><div><p>HOLDINGS</p><h1>保有資産</h1></div><button id="add" class="add" type="button">＋ 追加</button></div><div id="list" class="holding-list"></div></section>
    <details class="settings"><summary>株価更新の設定</summary><p>Stooqの無料APIキーを保存すると、日本株の最新終値を更新できます。</p><input id="api-key" type="password" placeholder="Stooq APIキー" autocomplete="off"><label class="switch"><input id="auto-refresh" type="checkbox">アプリ起動時・指定間隔で自動更新</label><label class="interval">更新間隔<select id="refresh-interval"><option value="5">5分</option><option value="15" selected>15分</option><option value="30">30分</option><option value="60">60分</option></select></label><div><button id="save-key" type="button">設定を保存</button><a href="https://stooq.com/q/d/?s=7261.jp&get_apikey" target="_blank" rel="noreferrer">キーを取得 ↗</a></div><small id="status">未更新</small></details>
  </main>
  <dialog id="editor"><form id="form" method="dialog"><div class="modal-title"><h2 id="form-title">銘柄を追加</h2><button value="cancel" type="submit">×</button></div><input id="id" type="hidden"><label>銘柄名<input id="name" required maxlength="36"></label><label>コード / ティッカー<input id="ticker" required maxlength="12"></label><label>資産クラス<input id="category" required maxlength="18" value="日本株"></label><label>数量<input id="quantity" type="number" required min="0.0001" step="any"></label><label>取得単価（円）<input id="cost-input" type="number" required min="0" step="any"></label><label>現在値（円）<input id="price" type="number" required min="0" step="any"></label><p id="error"></p><div class="modal-actions"><button value="cancel" type="submit">キャンセル</button><button id="save" class="save" type="button">保存</button></div></form></dialog>
  <script src="mobile.js"></script>
</body>
</html>
